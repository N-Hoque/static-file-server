name: CI

on:
  pull_request:
  workflow_call:
    outputs:
      did_build:
        description: "Whether a build artifact was produced"
        value: ${{ jobs.report.outputs.built || 'false' }}

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.file-changes.outputs.go }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: file-changes
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

  lint:
    name: Lint (golangci-lint)
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Run tests
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Generate coverage report
        run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Build binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          [[ "${GOOS}" == "windows" ]] && EXT=".exe"
          SUFFIX="${GOOS}-${GOARCH}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}"
          DEST="out/serve-${SUFFIX}${EXT}"
          mkdir -p out
          go build -ldflags "-s -w" -o "${DEST}" cmd/serve/main.go
          echo "name=$(basename "${DEST}")" >> "$GITHUB_OUTPUT"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bin.outputs.name }}
          path: ${{ steps.bin.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report outputs
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      built: ${{ steps.flag.outputs.built }}
    steps:
      - id: flag
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
