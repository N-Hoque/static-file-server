name: CI
on:
  pull_request:
  workflow_call:
    outputs:
      did_build:
        description: "Whether a build artifact was produced"
        value: ${{ jobs.report.outputs.built || 'false' }}

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.file-changes.outputs.go }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: file-changes
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'MODULE.bazel'
              - '**/*.bzl'
              - '**/BUILD.bazel'

  lint:
    name: Lint (golangci-lint)
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    continue-on-error: true
    env:
      BAZELISK_EXTRA_FLAGS: >-
        --repository_cache=${{ github.workspace }}/bazel-repo
        --disk_cache=${{ github.workspace }}/bazel-disk
        --color=yes
        --show_timestamps
        --announce_rc
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel repo+disk cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/bazel-repo
            ${{ github.workspace }}/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: Coverage
        run: |
          bazel coverage //... --combined_report=lcov || true

  test:
    name: Test (unit tests)
    runs-on: ubuntu-latest
    needs: [check]
    if: ${{ needs.check.outputs.go == 'true' }}
    env:
      BAZELISK_EXTRA_FLAGS: >-
        --repository_cache=${{ github.workspace }}/bazel-repo
        --disk_cache=${{ github.workspace }}/bazel-disk
        --color=yes
        --show_timestamps
        --announce_rc
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel repo+disk cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/bazel-repo
            ${{ github.workspace }}/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: Test
        run: |
          bazel test //... --test_output=errors

  build:
    name: Build
    needs: [lint, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        goos: [linux, windows, darwin]
        arch: [amd64, arm64]
    env:
      BAZELISK_EXTRA_FLAGS: >-
        --repository_cache=${{ github.workspace }}/bazel-repo
        --disk_cache=${{ github.workspace }}/bazel-disk
        --color=yes
        --show_timestamps
        --announce_rc
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel repo+disk cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/bazel-repo
            ${{ github.workspace }}/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build binary (cross-compile with rules_go)
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.goos }}/${{ matrix.arch }}" in
            linux/amd64)   PLATFORM="@rules_go//go/toolchain:linux_amd64" ;;
            linux/arm64)   PLATFORM="@rules_go//go/toolchain:linux_arm64" ;;
            darwin/amd64)  PLATFORM="@rules_go//go/toolchain:darwin_amd64" ;;
            darwin/arm64)  PLATFORM="@rules_go//go/toolchain:darwin_arm64" ;;
            windows/amd64) PLATFORM="@rules_go//go/toolchain:windows_amd64" ;;
            windows/arm64) PLATFORM="@rules_go//go/toolchain:windows_arm64" ;;
            *) echo "Unsupported GOOS/GOARCH"; exit 1 ;;
          esac

          bazel build //:serve --platforms="${PLATFORM}"

          OUT="$(bazel cquery //:serve --platforms="${PLATFORM}" --output=files)"
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXT=".exe"; fi

          mkdir -p out
          DEST="out/serve-${{ matrix.goos }}-${{ matrix.arch }}${EXT}"
          cp "$OUT" "$DEST"

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DEST")" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bin.outputs.name }}
          path: ${{ steps.bin.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report outputs
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      built: ${{ steps.flag.outputs.built }}
    steps:
      - id: flag
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
