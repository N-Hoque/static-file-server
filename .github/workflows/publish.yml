name: Docker Hub Publish (Linux)

on:
  push:
    branches: ["master-nhoque"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish (rules_oci)
    runs-on: ubuntu-latest
    environment: "Push Image"
    needs: [build]
    if: ${{ needs.build.outputs.did_build == 'true' }}
    env:
      BAZELISK_EXTRA_FLAGS: >-
        --repository_cache=${{ github.workspace }}/bazel-repo
        --disk_cache=${{ github.workspace }}/bazel-disk
    steps:
      - uses: actions/checkout@v6

      - name: Compute image repo + tags (mirror docker/metadata-action behavior)
        id: meta
        shell: bash
        run: |
          IMAGE="${{ vars.DOCKER_IMAGE }}"
          if [[ -z "$IMAGE" ]]; then
            echo "::error::vars.DOCKER_IMAGE is required"; exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          TAGS=()
          if [[ "${GITHUB_REF}" == refs/heads/master || "${GITHUB_REF}" == refs/heads/master-nhoque ]]; then
            TAGS+=("latest")
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS+=("${GITHUB_REF#refs/tags/}")
          fi
          SHA="$(git rev-parse HEAD)"
          TAGS+=("${SHA}")

          printf '%s\n' "${TAGS[@]}" | awk '{print "tag="$0}' >> "$GITHUB_OUTPUT"

      - uses: bazelbuild/setup-bazelisk@v3

      - uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/bazel-repo
            ${{ github.workspace }}/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel', 'go.mod', 'go.sum') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Login to registry (docker login)
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          USERNAME: ${{ vars.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PAT }}
        shell: bash
        run: |
          REG="${REGISTRY:-docker.io}"
          echo "$PASSWORD" | docker login "$REG" -u "$USERNAME" --password-stdin

      - name: Build image (linux/amd64)
        run: |
          bazel build //:serve_image --platforms=@rules_go//go/toolchain:linux_amd64

      - name: Push tags (rules_oci oci_push + stamping)
        env:
          DOCKER_IMAGE: ${{ steps.meta.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r k v; do
            if [[ "$k" == "tag" ]]; then
              export DOCKER_TAG="$v"
              echo "Pushing ${DOCKER_IMAGE}:${DOCKER_TAG}"
              bazel run //:push \
                --platforms=@rules_go//go/toolchain:linux_amd64 \
                --stamp \
                --workspace_status_command=tools/status.sh
            fi
          done < <(printf '%s\n' "${{ steps.meta.outputs.tag }}")
